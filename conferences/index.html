<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conference Races · SFCS</title>
  <link rel="icon" href="../assets/brand/profile.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wdth,wght@100..125,400..800&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/site.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const id = new URLSearchParams(location.search).get("c");
      const match = window.SFCS.CONFERENCES.find(([k]) => k === id);
      if (!match) return;
      const name = match[1];
      document.getElementById("conf-name").textContent = name;
      document.getElementById("conf-note").textContent = `Standings and title odds for the ${name} will live here.`;
      document.title = `${name} · Conference Races · SFCS`;
    });
  </script>
</head>
<body>
  <main>
    <div class="wrap">
      <header class="page-head">
        <p class="eyebrow">Conference Races</p>
        <h1 id="conf-name">Conference Races</h1>
      </header>

      <div class="placeholder">
        <strong>Coming soon</strong>
        <span id="conf-note">Pick a conference from the menu above.</span>
      </div>
    </div>
  </main>
</body>
</html>
